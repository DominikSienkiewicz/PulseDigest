    - "java"
    - "QuarkusIO"
    - "springcentral"
    - "micronautfw"
    - "gradle"
    - "adoptium"
    - "graalvm"
    - "kotlin"
    - "intellijidea"
    - "jetbrains"
    # AI / ML
    - "cerebral_valley"
    - "googlegemma"
    - "ollama"
    - "AnthropicAI"
    - "claudeai"
    - "OpenAI"
    - "OpenAIDevs"
    - "GoogleAIStudio"
    - "googleaidevs"
    - "antigravity"
    - "geminicli"
    - "GeminiApp"
    - "ElevenLabs"
    - "ElevenLabsDevs"
    - "grok"
    - "sama"
    - "xai"
    # Cloud / DevOps
    - "kubernetesio"
    - "Docker"
    - "grafana"
    - "linuxfoundation"
    - "awscloud"
    - "googlecloud"
    - "GoogleCloudTech"
    - "GoogleCloud_PL"
    - "Azure"
    - "googledevs"
    - "GoogleWorkspace"
    # Security
    - "TheHackersNews"
    - "metasploit"
    - "owasp"
    - "kalilinux"
    - "Whonix"
    - "QubesOS"
    - "Tails_live"
    - "torproject"
