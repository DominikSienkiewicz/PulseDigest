spring:
  application:
    name: PulseDigest
  main:
    web-application-type: none
  ai:
    openai:
      api-key: "${OPENAI_API_KEY:}"
  datasource:
    url: "${SUPABASE_DB_URL:}"
    username: "${SUPABASE_DB_USERNAME:}"
    password: "${SUPABASE_DB_PASSWORD:}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      connection-timeout: 30000
  sql:
    init:
      mode: always
      continue-on-error: false

twitter:
  bearer-token: "${TWITTER_BEARER_TOKEN:}"
  # Hard ceiling na wywołania X search/run (backstop na config-drift). Zamierzony intake:
  # ceil(accounts/8)=3 + queries=4 + 1 Anthropic = 8 calli; cap 10 daje headroom. Calle ponad budżet
  # są pomijane (pusty wynik + WARN), reszta darmowych źródeł pipeline'u i tak się wykonuje.
  max-calls-per-run: 10
  # Server-side próg engagementu (min_faves:N) dołączany do każdego query gdy > 0. WYŁĄCZONY (0)
  # domyślnie — operator min_faves nie jest dostępny na każdym tierze X API, a nieobsługiwany operator
  # wywala całe wyszukiwanie. Włącz (np. 3) dopiero po potwierdzeniu, że Twój tier go wspiera.
  min-faves: 0
  # Zapytania tematyczne skonsolidowane 8 -> 4 pod CV (JVM, LLM-tooling/agents/MCP, inference, cloud-native).
  queries:
    - "Spring Boot OR Quarkus OR GraalVM OR Virtual Threads -is:retweet lang:en"
    - "LangGraph OR LlamaIndex OR MCP OR Model Context Protocol OR AI agents -is:retweet lang:en"
    - "vLLM OR Ollama OR llama.cpp OR LLM inference -is:retweet lang:en"
    - "Kubernetes OR CNCF OR serverless OR Knative -is:retweet lang:en"
  # Konta przycięte 76 -> 24: tylko CV-relevant (JVM, AI-tooling, cloud, dev tools). Usunięto konta
  # security/pentest/privacy-OS i celebryckie (szum + palenie tokenów); newsy security idą przez RSS
  # (Niebezpiecznik/Sekurak są już w report.rss.feeds — konta X były redundantne).
  accounts:
    # Java / JVM ecosystem
    - "java"
    - "springcentral"
    - "QuarkusIO"
    - "micronautfw"
    - "graalvm"
    - "kotlin"
    - "gradle"
    - "jetbrains"
    # AI / LLM tooling
    - "AnthropicAI"
    - "claudeai"
    - "OpenAI"
    - "OpenAIDevs"
    - "googleaidevs"
    - "GoogleAIStudio"
    - "ollama"
    - "geminicli"
    - "grok"
    - "xai"
    # Cloud / DevOps
    - "kubernetesio"
    - "Docker"
    - "awscloud"
    - "googlecloud"
    # Databases / dev tools
    - "PostgreSQL"
    - "github"

report:
  cache-ttl-minutes: 60
  min-generation-interval-minutes: 30
  email:
    resend-api-key: "${RESEND_API_KEY:}"
    from: "${DIGEST_FROM_EMAIL:}"
    to: "${DIGEST_TO_EMAIL:}"

  research:
    min-likes: 3
    days-back: 2
    authority-usernames:
      - karpathy
      - swyx
      - levelsio
      - andrewchen
      - emollick
      - paulg
      - sama
      - xai
      - OpenAI
      - AnthropicAI
      - IBM
      - claudeai

  hacker-news:
    base-url: https://hn.algolia.com/api/v1/search
    keywords:
      - ai
      - llm
      - agent
      - rag
      - mcp
      - java
      - jvm
      - kotlin
      - spring
      - quarkus
      - graalvm
      - python
      - langchain
      - kubernetes
      - container
      - docker
      - cncf
      - serverless
      - edge
      - devops
      - opentelemetry
      - observability
    limit: 15
    min-score: 25

  # Tech-demand pulse: agreguje wzmianki technologii w miesięcznym wątku HN "Who is hiring?".
  # Sekcja renderuje się TYLKO gdy wątek jest świeży (okno lookback-days) — poza tym znika,
  # więc nie powtarza się codziennie. Liczone poza budżetem itemów rdzenia (osobny boks).
  tech-demand:
    enabled: true
    base-url: https://hn.algolia.com/api/v1
    lookback-days: 7
    max-comments: 1000
    max-technologies: 8
    min-mentions: 3
    technologies:
      # rdzeń odbiorcy
      - java
      - kotlin
      - scala
      - spring
      - quarkus
      - graalvm
      - python
      - fastapi
      - pytorch
      - kubernetes
      - docker
      - terraform
      - aws
      - gcp
      - azure
      # szeroki rynek (sygnał, nie tylko własny stack)
      - go
      - rust
      - typescript
      - react
    # "Twój stack" — pokazywany w osobnej linii niezależnie od top-8 (popyt na Twój rdzeń).
    priority-technologies:
      - java
      - kotlin
      - spring
      - quarkus
      - graalvm
      - python

  github:
    query: "(topic:ai OR topic:machine-learning OR topic:llm)"
    limit: 8

  rss:
    limit: 10
    feeds:
      - name: "InfoQ"
        url: "https://feed.infoq.com"
      - name: "The Register"
        url: "https://www.theregister.com/headlines.atom"
      - name: "Baeldung"
        url: "https://www.baeldung.com/feed"
      - name: "Spring Blog"
        url: "https://spring.io/blog.atom"
      - name: "DZone Java"
        url: "https://feeds.dzone.com/java"
      - name: "DZone AI"
        url: "https://feeds.dzone.com/ai-ml"
      - name: "Niebezpiecznik"
        url: "https://niebezpiecznik.pl/feed"
      - name: "Sekurak"
        url: "https://sekurak.pl/feed"
      - name: "JVM Bloggers"
        url: "https://jvm-bloggers.com/pl/rss.xml"
      - name: "devstyle.pl"
        url: "https://devstyle.pl/feed"
      - name: "TLDR Tech"
        url: "https://tldr.tech/rss/tech"
      - name: "Pragmatic Engineer"
        url: "https://newsletter.pragmaticengineer.com/feed"
      - name: "Quastor"
        url: "https://blog.quastor.org/feed"
      # ── Oficjalne changelogi (Tier 1) ─────────────────────────────────────
      - name: "OpenAI News"
        url: "https://openai.com/news/rss.xml"
      # Anthropic intentionally does not publish RSS; coverage comes via Twitter
      # authority accounts @AnthropicAI / @claudeai (see twitter.accounts above).
      - name: "Google Blog"
        url: "https://blog.google/rss/"
      - name: "JetBrains Blog"
        url: "https://blog.jetbrains.com/feed/"
      # ── Newslettery AI (Tier 2 rozszerzony) ───────────────────────────────
      - name: "Import AI"
        url: "https://importai.substack.com/feed"
      - name: "Simon Willison"
        url: "https://simonwillison.net/atom/everything/"
      - name: "Latent Space"
        url: "https://www.latent.space/feed"
      - name: "Sebastian Raschka"
        url: "https://magazine.sebastianraschka.com/feed"
      - name: "Andrej Karpathy"
        url: "https://karpathy.github.io/feed.xml"
      # ── Lobsters (Tier 1) ────────────────────────────────────────────────
      - name: "Lobsters"
        url: "https://lobste.rs/rss"
      # ── Tier 3 (dev.to) ──────────────────────────────────────────────────
      - name: "dev.to AI"
        url: "https://dev.to/feed/tag/ai"
      - name: "dev.to Java"
        url: "https://dev.to/feed/tag/java"
      # ── Tier 4 PL ────────────────────────────────────────────────────────
      - name: "JVM Advent"
        url: "https://www.javaadvent.com/feed"
      # ── Cloud Providers ─────────────────────────────────────────────────
      - name: "AWS Blog"
        url: "https://aws.amazon.com/blogs/aws/feed/"
      - name: "Google Cloud Blog"
        url: "https://docs.cloud.google.com/feeds/gcp-release-notes.xml"
      - name: "Azure Updates"
        url: "https://azure.microsoft.com/en-us/updates/feed/"
      # ── JVM Ecosystem ────────────────────────────────────────────────────
      - name: "Inside.java"
        url: "https://inside.java/feed.xml"
      # ── Cloud Native ────────────────────────────────────────────────────
      - name: "CNCF Blog"
        url: "https://www.cncf.io/blog/feed/"

  reddit:
    limit: 15
    min-score: 20
    subreddits:
      - "java"
      - "programming"
      - "MachineLearning"
      - "LocalLLaMA"
      - "devops"
      - "kubernetes"
      - "datascience"
      - "artificial"
  arxiv:
    categories: "cs.AI,cs.LG,cs.CR,cs.DC,cs.PL"
    keywords: "agent,llm,rag,inference,jvm,virtual thread,kubernetes,container,orchestration,serverless,edge,mcp,vector,embedding,fine-tuning,training,alignment,safety,speculative,decoding,quantization"
    max-results: 20
    lookback-hours: 48

  trend:
    enabled: true
    lookback-days: 7
    min-occurrences: 2
    max-clusters: 5

  github-releases:
    lookback-hours: 72
    repositories:
      - "spring-projects/spring-boot"
      - "spring-projects/spring-ai"
      - "quarkusio/quarkus"
      - "oracle/graal"
      - "micronaut-projects/micronaut-core"
      - "langchain4j/langchain4j"
      - "ollama/ollama"
      - "vllm-project/vllm"
      - "ggml-org/llama.cpp"
      - "BerriAI/litellm"
      - "anthropics/anthropic-java"
      - "kubernetes/kubernetes"
      - "hashicorp/terraform"
      - "docker/compose"
      - "testcontainers/testcontainers-java"
      - "open-telemetry/opentelemetry-java"
      - "grafana/grafana"

  hugging-face:
    base-url: https://huggingface.co/api/models
    limit: 30
    min-likes: 3
    min-downloads: 50
    relevant-pipelines:
      - text-generation
      - text-to-image
      - text-to-speech
      - image-to-text
      - automatic-speech-recognition
      - feature-extraction
      - text-to-video

  product-hunt:
    base-url: https://api.producthunt.com/v2/api/graphql
    developer-token: "${PRODUCTHUNT_DEVELOPER_TOKEN:}"
    min-votes: 100
    lookback-hours: 36
    relevant-topics:
      - "Artificial Intelligence"
      - "Developer Tools"
      - "Productivity"
      - "Open Source"
      - "Tech"

  security-advisories:
    base-url: https://api.github.com/advisories
    limit: 20
    lookback-hours: 72
    min-severities:
      - HIGH
      - CRITICAL
    # Security is a background topic — keep only ecosystems the audience actually ships on
    # (JVM via Gradle→maven, Python-AI→pip, containers→docker, CI→actions). Dropped npm/go/
    # composer/rubygems: off-stack advisories were the main source of security noise.
    relevant-ecosystems:
      - maven
      - pip
      - docker
      - actions

  open-jdk:
    base-url: https://api.github.com/repos/openjdk/jdk/commits
    lookback-days: 7
    relevant-statuses:
      - Candidate
      - Proposed to Target
      - Integrated
      - Delivered

  cncf-landscape:
    base-url: https://api.github.com/repos/cncf/landscape/commits
    lookback-days: 7
    relevant-statuses:
      - sandbox
      - incubating
      - graduated
      - archived

  technology-radar:
    base-url: https://raw.githubusercontent.com
    data-path: /setchy/thoughtworks-tech-radar-volumes/main/volumes/json/Thoughtworks%20Technology%20Radar%20Volume%2034%20(Apr%202026).json
    lookback-months: 6

  conference-talks:
    base-url: https://www.googleapis.com/youtube/v3/search
    api-key: "${YOUTUBE_API_KEY:}"
    lookback-days: 7
    max-results: 10
    channels:
      - channel-name: "SpringDeveloper"
        conference-name: "Spring I/O"
        channel-id: "UCvT2j2iACv7QUaFpB4fJjGw"
      - channel-name: "CNCF"
        conference-name: "KubeCon"
        channel-id: "UCvqbFHwN-nwalWPjPUKpvTA"
      - channel-name: "Devoxx"
        conference-name: "Devoxx"
        channel-id: "UCJyEBMU1-Kb1pGjWvFz5X3g"
      - channel-name: "Google Cloud Tech"
        conference-name: "Google Cloud Next"
        channel-id: "UCJSBzeANgUXDr5XyOQBnLVA"
      - channel-name: "InfoQ"
        conference-name: "QCon"
        channel-id: "UCsYVgBx0Kx0MGFj0qQ2qLtA"
      - channel-name: "GOTO Conferences"
        conference-name: "GOTO"
        channel-id: "UCs_tLP3AiwYKwdUHpltJPuA"

  lab-announcements:
    lookback-hours: 48
    # JSONLD sources have no dates on the listing — we fetch up to this many post pages per source
    # to read `datePublished` from JSON-LD. Tune up if a lab ships >N posts in the lookback window.
    post-fetch-limit: 15
    sources:
      # SANITY — anthropic.com embeds Sanity CMS data inline (publishedOn + slug + title + summary).
      - name: "Anthropic News"
        strategy: SANITY
        listing-url: https://www.anthropic.com/news
      - name: "Anthropic Engineering"
        strategy: SANITY
        listing-url: https://www.anthropic.com/engineering
      # JSONLD — listing has post links but no dates; each post page carries datePublished JSON-LD.
      - name: "Claude Blog"
        strategy: JSONLD
        listing-url: https://claude.com/blog
        article-link-regex: 'href="(/blog/[a-z0-9-]+)"'
      - name: "Google Gemini Blog"
        strategy: JSONLD
        listing-url: https://blog.google/products-and-platforms/products/gemini/
        article-link-regex: 'href="(https://blog\.google/[a-z0-9/-]{30,}/)"'
      # OPENAI_DEV — developers.openai.com renders cards with date + title + description inline.
      - name: "OpenAI Dev Blog"
        strategy: OPENAI_DEV
        listing-url: https://developers.openai.com/blog
    # NOTE: openai.com/news is intentionally absent — it sits behind Cloudflare bot protection
    # that rejects all server-side requests (HTTP 403). gemini.google/latest-news is also absent —
    # it is a JS-rendered marketing page with no dated posts; its real news links to blog.google.
