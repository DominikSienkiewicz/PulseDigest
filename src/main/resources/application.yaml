  # Free-source recovery (C7): Bluesky author-feeds + Mastodon hashtag-timelines (oba public, bez auth)
  # odzyskują sygnał CV-relevant przycięty pod budżet X. Jeden scalony source "Social"; każda sieć
  # degraduje się gracefully (źródło FAILED tylko gdy OBIE padną).
  #
  # K6, zmierzone na żywo 2026-10-19 — ten blok był do tego dnia skonfigurowany tak, że źródło
  # "Bluesky + Mastodon, 15 postów" było w rzeczywistości timeline'em firmowego konta Bluesky:
  #   bsky.app            29 postów/14d, 28 ponad progiem 5, MEDIANA 1403 like'ów
  #   fosstodon #java…#ai 200 postów,     1 ponad progiem 5  (max 19, typowo 0-3)
  # Jeden wspólny `min-likes: 5` plus sortowanie po surowej liczbie like'ów = cała pula dla konta
  # najpopularniejszego w liczbach bezwzględnych, a na Bluesky jest nim samo Bluesky. Dlatego:
  #   - próg jest PER SIEĆ (like na fosstodonie i like na bsky to nie ta sama wielkość),
  #   - `max-per-account` ogranicza, ile slotów weźmie jedno konto — bez tego wymiana seeda tylko
  #     przenosi monopol na następne popularne konto.
  social:
    limit: 15
    max-per-account: 3
    bluesky:
      base-url: https://public.api.bsky.app
      min-likes: 5
      # Roster zweryfikowany na żywo 2026-10-19 (posty/14d, ile ponad progiem):
      handles:
        - simonwillison.net   # 22/14d, 18 ponad progiem — LLM/AI, dev tooling
        - kotlinlang.org      # 17/14d, 13 ponad progiem — JVM
        - quarkus.io          # 20/14d,  1 ponad progiem — Java, niska reakcja, próg przycina
        - nipafx.dev          # 3/14d,   2 ponad progiem — Java (Nicolai Parlog)
        - danvega.dev         # 6/14d,   1 ponad progiem — Spring
      # Sprawdzone i ODRZUCONE jako martwe: bsky.app (seed, patrz wyżej), java-champions (704 dni),
      # openjdk.org (501), spring.io (139), jetbrains.com (32), hibernate.org (384), vladmihalcea (19).
      # Większość ekosystemu JVM nie przeniosła się na Bluesky; AI/LLM częściowo tak. To jest powód,
      # dla którego ta połowa źródła ma sens tylko z rosterem przechylonym w stronę AI.
    mastodon:
      instance-url: https://fosstodon.org
      # Próg 1, nie 5: patrz pomiar wyżej. Przy 5 ta połowa źródła nie wnosiła nic.
      min-likes: 1
      hashtags:
        - java
        - quarkus
        - kubernetes
        - llm
        - ai

