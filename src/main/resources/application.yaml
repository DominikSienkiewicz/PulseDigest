    - "Virtual Threads OR GraalVM OR Quarkus -is:retweet lang:en"
    - "vLLM OR Ollama OR llama.cpp inference -is:retweet lang:en"
    - "MCP Model Context Protocol -is:retweet lang:en"
    - "serverless OR Knative OR eBPF -is:retweet lang:en"
    - "DDD domain driven design -is:retweet lang:en"
  accounts:
