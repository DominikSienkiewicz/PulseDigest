    developer-token: "${PRODUCTHUNT_DEVELOPER_TOKEN:}"
    min-votes: 100
    lookback-hours: 104        # było 36 — daily-shaped okno gubiło launche między biegami
    relevant-topics:
      - "Artificial Intelligence"
      - "Developer Tools"
      - "Productivity"
      - "Open Source"
      - "Tech"

  security-advisories:
    base-url: https://api.github.com/advisories
    limit: 20
    lookback-hours: 104        # było 72 — dorównać max gap czw->pn (96h) + margines
