  reddit:
    limit: 15
    min-score: 30              # było 20 — wyższy próg jakości (mniej szumu)
    subreddits:
      - "java"
      - "programming"
      - "MachineLearning"
      - "LocalLLaMA"
      - "devops"
      - "kubernetes"
      - "datascience"
      - "artificial"

  # Free-source recovery (C7): Bluesky author-feeds + Mastodon hashtag-timelines (oba public, bez auth)
  # odzyskują sygnał CV-relevant przycięty pod budżet X. Jeden scalony source "Social"; każda sieć
  # degraduje się gracefully (źródło FAILED tylko gdy OBIE padną). Dostrój handles/hashtags pod siebie.
  social:
    limit: 15
    min-likes: 5
    bluesky:
      base-url: https://public.api.bsky.app
      handles:
        - bsky.app        # seed (oficjalne konto) — dodaj CV-relevant handles (AI/Java dev) z bsky.app
    mastodon:
      instance-url: https://fosstodon.org
      hashtags:
        - java
        - quarkus
        - kubernetes
        - llm
        - ai

  arxiv:
    categories: "cs.AI,cs.LG,cs.CR,cs.DC,cs.PL"
    keywords: "agent,llm,rag,inference,jvm,virtual thread,kubernetes,container,orchestration,serverless,edge,mcp,vector,embedding,fine-tuning,training,alignment,safety,speculative,decoding,quantization"
    max-results: 20
    lookback-hours: 104        # było 48 — daily-shaped okno gubiło treść w gapie czw->pn (96h)

  github-releases:
    lookback-hours: 104        # dorównać max gap czw->pn (96h) + margines, by release nie wypadł
    repositories:
