report:
  min-generation-interval-minutes: 30
  email:
    resend-api-key: "${RESEND_API_KEY:}"
    from: "${DIGEST_FROM_EMAIL:}"
    to: "${DIGEST_TO_EMAIL:}"

  # Cross-edition dedup: pomija itemy (po kanonicznym URL), które pojawiły się w wydaniu z ostatnich
  # lookback-days dni. Okna lookback celowo zachodzą na poprzedni bieg (żeby nic nie wypadło w gapie
  # czw->pn), więc to dedup — nie wąskie okno — gwarantuje, że item nie pojawi się w mailu dwa razy.
  dedup:
    enabled: true
    lookback-days: 10          # >= najszersze okno (open-jdk/conference-talks 10d), więc łapie każdy overlap

  # Pre-scoring: gpt-4o-mini triage'uje ~100 itemów po tytule; do gpt-4o idzie top `keep`.
  # Itemy o deterministycznym pre-score >= 90 (GitHub Releases, lab announcements) są nietykalne.
  # Awaria calla mini = pełny payload leci dalej (nigdy nie chudzimy digestu przez błąd infry).
  pre-scoring:
    enabled: true
    keep: 50

  # Twój radar: technologie, o których digest MUSI się wypowiedzieć — także wtedy, gdy nic się nie
  # działo ("Spring AI: 0 wzmianek"). Skan leci po WSZYSTKICH pobranych nagłówkach tego biegu, nie po
  # itemach, które przeszły budżet promptu — inaczej "0" nie odróżniałoby ciszy od przycięcia.
  watchlist:
    enabled: true
    technologies:
      - spring ai
      - spring boot
      - quarkus
      - graalvm
      - virtual threads
      - langgraph
      - mcp
      - ollama
      - vllm
      - pgvector

  # Żywy Model Czytelnika: raz w tygodniu gpt-4o-mini destyluje z głosów 👍/👎 kilka datowanych,
  # udowodnionych hipotez o czytelniku. Każda liczba niżej to bariera przed dryfem profilu:
  # min-votes = nie modeluj czytelnika z szumu; refresh-days = jeden call mini na tydzień, nie na bieg;
  # hypothesis-ttl-days = hipoteza, której czytelnik przestał potwierdzać, wygasa zamiast sterować wiecznie.
  reader-profile:
    enabled: true
    min-votes: 10
    refresh-days: 7
    hypothesis-ttl-days: 60

  # Report history: poprzednie wydania czytane z tabeli `reports` (pełny JSONB był zapisywany od
  # zawsze, nikt go nie czytał). Daje pamięć trendów ("3. edycja z rzędu", "pierwszy sygnał: 18.06")
  # oraz czwartkowy recap tygodnia. 28 dni ≈ 8 wydań przy kadencji pn/czw.
  history:
    enabled: true
    lookback-days: 28

  # Feedback loop (C6): headless-batch tylko CZYTA feedback. receiver-url = zewnętrzny endpoint, do
  # którego prowadzą linki 👍/👎 w mailu (np. Supabase Edge Function piszący do tabeli `feedback`).
  # Puste receiver-url = brak linków w mailu (graceful). Down-voty z ostatnich lookback-days są wyciszane.
  feedback:
    enabled: true
    lookback-days: 30
    receiver-url: "${FEEDBACK_RECEIVER_URL:}"
    # Sekret współdzielony z receiverem. Ustawiony ⇒ każdy link 👍/👎 niesie &sig=HMAC(url|vote|source|edition),
    # więc głosu nie da się sfałszować ani przerobić w locie. Pusty ⇒ linki bez podpisu, dzisiejszy
    # receiver działa bez zmian — dzięki temu podpis można wdrożyć ZANIM receiver nauczy się go weryfikować.
    signing-secret: "${FEEDBACK_SIGNING_SECRET:}"

  research:
    min-likes: 3
    days-back: 5               # 120h pokrywa max gap czw->pn (96h) + margines (parytet z oknami 104h)
    authority-usernames:
      - karpathy
      - swyx
      - levelsio
      - andrewchen
      - emollick
      - paulg
      - sama
      - xai
      - OpenAI
      - AnthropicAI
      - IBM
      - claudeai

  hacker-news:
