name: PulseDigest

on:
  pull_request:
  push:
    branches:
      - main
  # Automatyczne generowanie i wysyłanie digestu w cyklu poniedziałek / czwartek.
  schedule:
    # 04:00 UTC = 06:00 CEST (lato) / 05:00 CET (zima). Dni tygodnia 1,4 = pn/czw.
    # Przerwy między biegami: pn->czw 72h, czw->pn 96h. Okna lookback w application.yaml
    # są dostrojone do tej większej z nich (104h = 96h + margines), więc każdy bieg
    # obejmuje cały zakres od poprzedniego raportu; dedup odsiewa nakładkę.
    - cron: '0 4 * * 1,4'
  workflow_dispatch:

jobs:
  # N45 — the control exists rather than being inferred from good luck. The repository has eight
  # credentials in play and a public history; the 2026-10-15 audit found no committed secret, which
  # is evidence about the past and not a guarantee about the next commit. Allowlists live in
  # .gitleaks.toml and are narrow by design: a scanner that cries wolf on test fixtures gets
  # switched off, and a switched-off scanner is worse than none because the badge stays.
  secrets:
    name: Secret scan
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: a secret removed from the tip is still a leaked secret.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # fetch-depth: 0 — bez pełnej historii krok "Verify merge subjects" nie ma czego sprawdzać
      # (shallow clone nie zawiera commita bazowego, a skrypt wtedy świadomie przepuszcza).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # C5 — konwencja tematów merge'y jako gate, nie jako notatka. Zapisana reguła działa tylko
      # tak dobrze, jak pamięć autora w dniu merge'a; historia ma cztery pary zdublowanych tematów,
      # bo lokalny merge domyślnie bierze temat gałęzi i nic nie protestowało.
      - name: Verify merge subjects
        run: ./scripts/check-merge-subjects.sh

      # README jest routerem do /docs/, więc link, który nie prowadzi do pliku, jest
      # defektem publicznym — a nie widać go w żadnym teście Javy. Do 2026-10-19 ta logika
      # siedziała inline tutaj i rozstrzygała cele po dysku, przez co miała dwie dziury naraz:
      # autor nie mógł jej uruchomić przed pushem, a link do ignorowanego `docs/concepts/`
      # przechodził u niego i wywalał się dopiero w checkoucie. Skrypt pyta o pliki ŚLEDZONE
      # przez gita i chodzi lokalnie; resztę zakresu tłumaczy jego nagłówek.
      - name: Verify Markdown links
        run: ./scripts/check-markdown-links.sh

      # Skrypty w `scripts/` są dziś gate'ami pozostałych reguł, więc cichy błąd w nich wyłącza
      # kontrolę, nie zapalając niczego na czerwono — a w shellu nie ma żadnego innego strażnika
      # klas błędów, które shellcheck łapie (niecytowane zmienne, przypadkowy splitting). Lista
      # z `git ls-files`, nie z globa po dysku, i po `*.sh`: to z rozmysłem omija `gradlew`, który
      # jest generowany przez Gradle i nie jest nasz do poprawiania. Binarka jest preinstalowana
      # na obrazie runnera (apt `shellcheck`); gdyby wypadła przy przejściu `ubuntu-latest` na
      # 26.04 w listopadzie 2026, krok padnie głośno na "command not found" — nie przemilczy.
      #
      # The file list arrives NUL-delimited rather than through `$(git ls-files '*.sh')`, which is
      # what the `Verify workflows` step below reports as SC2046. The word splitting there was
      # deliberate — it is how the list becomes separate arguments — but deliberate and correct are
      # not the same thing: the unquoted form also breaks on any tracked path containing a space.
      # `-z | xargs -0` gets the arguments apart without either hazard. Preferred over an inline
      # `shellcheck disable=SC2046`, because a suppression records the hazard while leaving it in
      # place, and this removes it instead.
      - name: Verify shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      # Workflow files were the last substantial artefact here with no gate, and they carry most of
      # this repository's operational logic: six jobs, the Mon/Thu schedule, the Flyway upgrade-path
      # job, the Pages publish. actionlint is the only tool in the build that reads them as more than
      # YAML — it type-checks ${{ }} expressions against the real context shapes, rejects unknown
      # action inputs and invalid cron, and runs shellcheck over every `run:` block. That last part
      # is not hypothetical: it is what found the SC2046 corrected in the step above.
      #
      # Installed with `go install` rather than from an action, because actionlint publishes no
      # GitHub Action of its own. The alternatives were a `docker://rhysd/actionlint` digest and a
      # curl-to-bash of its install script; both need a hand-bumped pin that Dependabot does not
      # track, and neither is verified beyond the name it is fetched by. The pin is the commit SHA
      # rather than the `v1.7.12` tag that points at it: a tag can be re-pointed at its source, a
      # commit cannot, and `go install` checks either against the Go checksum database. That makes
      # the pin cryptographic rather than nominal, which is also the form Sonar S8545 asks for.
      # Go is preinstalled on the runner image, exactly as shellcheck is for the step above — if
      # that stops being true the step fails loudly on "command not found" instead of passing mute.
      #
      # Invoked bare, so actionlint lints every file under .github/workflows: a workflow added later
      # is covered the day it appears rather than when someone remembers to extend a list.
      # Locally: `brew install actionlint && actionlint`.
      - name: Verify workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          "$(go env GOPATH)/bin/actionlint"

      # The Gradle dependency cache belongs to gradle/actions/setup-gradle, not to setup-java's
      # `cache: gradle`. The difference is not cosmetic: setup-java keys ONE entry on a hash of the
      # build files and then never updates it — every job logs "Cache hit occurred on the primary
      # key ..., not saving cache" — so whichever of these five parallel jobs saves it first fixes its
      # contents for every job that follows, until a build file changes.
      #
      # What that cost, 2026-10-19: the entry (53 MB, written 22:17) left enough of the test classpath
      # unresolved that `sonarcloud` went red at 22:38:47 on eighteen modules, from
      # `com.tngtech.archunit:archunit-junit5:1.5.0` to `org.assertj:assertj-core:3.27.7` — every one
      # of which Maven Central serves, and every one of which `check` resolved from the SAME restored
      # cache twelve seconds later. The identical command had passed ten minutes earlier on that key,
      # so the pins were never the problem; the re-resolution on every job was.
      #
      # It landed on `sonarcloud` rather than `check` because the sonarqube plugin resolves
      # testCompileClasspath during TASK-GRAPH CONSTRUCTION, eight seconds into the build, and Gradle
      # reuses a configuration's failed resolution for the rest of that build — so one early miss also
      # condemned :compileTestJava, which is why that run reported the same failure twice.
      #
      # setup-gradle writes a per-job entry and refreshes it on every push to the default branch
      # (`cache-read-only` defaults to false there and true on branches), so PR jobs read a warm cache
      # without five of them racing to write one.
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: oracle
          java-version: '26'

      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0

      # N17 — render the recorded digest at phone width before the gate, so
      # MobileRenderingRegressionTest has something to compare against. The renderer is a pinned
      # container rather than whatever Chrome this runner ships, because a screenshot diff is only a
      # test when both sides come from the same renderer. Without this step the test aborts rather
      # than fails, which is right for a developer without Docker and wrong for CI — so CI runs it.
      - name: Render mobile snapshot
        run: ./scripts/mobile-snapshot.sh

      - name: Check
        run: ./gradlew check --no-daemon

      # The rendered snapshot, on every run. A pixel-diff failure is unreadable from a log line; the
      # only useful response is to look at the image, so CI has to hand it over.
      - name: Upload mobile snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-snapshot-${{ github.run_id }}
          path: build/mobile/sample-digest-mobile.png
          retention-days: 14
          if-no-files-found: ignore

  # Why this job exists, given that `check` already runs Flyway.
  #
  # The persistence ITs apply db/migration to a Testcontainers Postgres, so `check` proves the
  # migration set applies cleanly to a FRESH database using whatever Flyway version this branch
  # pins. It cannot prove the other half, and the other half is the one production takes: the
  # deployed flyway_schema_history was WRITTEN by the version on main, and a version bump has to
  # read that table before it writes to it. A fresh-database run never touches that path.
  #
  # So this job reproduces the upgrade: seed the history with main's engine, then migrate with this
  # branch's. On a branch that does not move flywayVersion both halves use the same version and the
  # job degrades to an end-to-end check of the flywayMigrate task itself — which `check` also never
  # runs, because the task lives on its own flywayCli configuration and only the digest job calls it.
  flyway:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Same image the persistence ITs use, so a failure here is a Flyway difference and not a
        # Postgres one.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsedigest
          POSTGRES_PASSWORD: pulsedigest
          POSTGRES_DB: pulsedigest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FLYWAY_URL: jdbc:postgresql://localhost:5432/pulsedigest
      FLYWAY_USER: pulsedigest
      FLYWAY_PASSWORD: pulsedigest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: oracle
          java-version: '26'

      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0

      # The baseline is main's state, not this branch's — main is what wrote the history table the
      # deployed database carries. Both the build file AND the migration directory are swapped: with
      # only the build file swapped, a branch that adds V2 *and* bumps Flyway would apply V2 here
      # with the OLD engine, leaving the new engine with nothing to do — the job would go green
      # having skipped the thing it exists to exercise. Seeding from main's migrations instead means
      # the new engine both reads a history the old one wrote and applies the new migration itself.
      - name: Seed flyway_schema_history using main's Flyway version and migrations
        run: |
          git fetch --no-tags --depth=1 origin main
          git checkout FETCH_HEAD -- build.gradle.kts src/main/resources/db/migration
          grep -E 'val flywayVersion' build.gradle.kts
          ls src/main/resources/db/migration
          ./gradlew flywayMigrate --no-daemon
          git checkout HEAD -- build.gradle.kts src/main/resources/db/migration

      # The step under test. On a Flyway bump this is the first time the new engine reads a history
      # table written by the old one — the exact path the scheduled digest takes against Supabase.
      - name: Apply migrations with this branch's Flyway version
        run: |
          grep -E 'val flywayVersion' build.gradle.kts
          ls src/main/resources/db/migration
          ./gradlew flywayMigrate --no-daemon

      # A second run must apply nothing. Asserted on the line FlywayMigrate logs, not on the exit
      # code: "re-applied V1" and "applied nothing" both exit 0, and only one of them is correct.
      # Matching a string that MUST be present also keeps this from passing on an empty log.
      - name: Second run must be a no-op
        run: |
          ./gradlew flywayMigrate --no-daemon 2>&1 | tee migrate.log
          grep -q 'Flyway: 0 migration(s) applied' migrate.log \
            || { echo "::error::Second flywayMigrate was not a no-op — see the log above."; exit 1; }

  sonarcloud:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One-time SonarCloud setup (see README → "SonarCloud"):
    #   1. Create a SONAR_TOKEN repository secret (SonarCloud → My Account → Security).
    #   2. Disable "Automatic Analysis" in SonarCloud (Administration → Analysis Method) —
    #      CI-based and automatic analysis cannot both run on one project.
    # Project key / organization live in build.gradle.kts (sonar {} block). The scan step
    # is skipped until SONAR_TOKEN exists, so this job never blocks CI before it's set up.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # full history → accurate new-code detection & blame attribution

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: oracle
          java-version: '26'

      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0

      # Runs tests, produces the JaCoCo XML report, then the Gradle Sonar plugin uploads
      # sources + bytecode + coverage to SonarCloud. Skipped until SONAR_TOKEN is set
      # (e.g. on fork PRs, where secrets are unavailable).
      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./gradlew test jacocoTestReport sonar --no-daemon

  # N31–N33 — the public archive. A separate job, after the digest, deliberately:
  #
  # Publishing is the one irreversible thing this project does, so it is its own step with its own
  # permissions rather than a side effect of sending an edition. It rebuilds the whole site from the
  # database every time — the site is then a pure function of what is stored, and a bad deployment
  # is fixed by running the job again rather than by repairing a directory nobody can see.
  #
  # `needs: digest` with `if: success()` means a failed or skipped digest never republishes: an
  # archive is a record, and a record that changes when the thing it records failed is not one.
  archive:
    needs: digest
    if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: oracle
          java-version: '26'

      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0

      - name: Build the archive from stored editions
        run: |
          ./gradlew bootJar --no-daemon
          java -jar build/libs/app.jar --publish-archive
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_USERNAME: ${{ secrets.SUPABASE_DB_USERNAME }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          # Deliberately absent: FEEDBACK_SIGNING_SECRET and FEEDBACK_RECEIVER_URL. The published
          # rendering strips every feedback link regardless, and a job that cannot sign a link
          # cannot leak a signed one even if that code changed.

      # The belt to the renderer's braces. PublicEditionRendererTest and ArchiveSiteFileAdapterTest
      # already assert this, but those run against a fixture; this runs against what is about to be
      # made public, and fails the deployment rather than the build.
      - name: Refuse to publish anything carrying a feedback link
        run: |
          if grep -rlE 'sig=|vote=|edition=' build/archive/ ; then
            echo "::error::A generated archive file carries a feedback link. Not publishing."
            exit 1
          fi
          echo "Archive is clean: no feedback links in $(find build/archive -type f | wc -l) file(s)."

      - uses: actions/configure-pages@v5.0.0

      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: build/archive

      - id: deploy
        uses: actions/deploy-pages@v4.0.5

  digest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # N44. `id-token` and `attestations` are what signing build provenance needs; `contents: read`
    # is the default this would otherwise widen. Scoped to this job because it is the only one that
    # produces the artifact that actually runs.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Never run two digests at once (a manual dispatch overlapping the scheduled run would
    # otherwise double-send the email and double-spend OpenAI credits).
    concurrency:
      group: pulsedigest-digest
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: oracle
          java-version: '26'

      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0

      - name: Verify required secrets are present
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_USERNAME: ${{ secrets.SUPABASE_DB_USERNAME }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # K7 (2026-10-19): TWITTER_BEARER_TOKEN is no longer required. X stays in the code but is
          # disabled in report.sources.disabled, and a scheduled run must not fail for want of a paid
          # credential it never uses. Re-enabling the source puts it back on this list — and the
          # application refuses to start without it in that case, so the gap is not silent.
          missing=()
          for var in OPENAI_API_KEY RESEND_API_KEY \
                     DIGEST_FROM_EMAIL DIGEST_TO_EMAIL \
                     SUPABASE_DB_URL SUPABASE_DB_USERNAME SUPABASE_DB_PASSWORD; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are configured."

      # Run the full gate (tests + Checkstyle + ArchUnit + coverage) before building the JAR, so a
      # broken pre-release SNAPSHOT dependency is caught here instead of shipping into the digest.
      - name: Verify build and build JAR
        run: ./gradlew check bootJar --no-daemon

      # Apply any pending schema migrations to Supabase before the app touches the database. Flyway
      # records what it has already run in flyway_schema_history, so this is a no-op once the schema is
      # current — on a fresh database it applies V1, on later runs only the new versions. The app does
      # not migrate at startup; this is the one place the schema changes.
      - name: Migrate database (Flyway)
        run: ./gradlew flywayMigrate --no-daemon
        env:
          FLYWAY_URL: ${{ secrets.SUPABASE_DB_URL }}
          FLYWAY_USER: ${{ secrets.SUPABASE_DB_USERNAME }}
          FLYWAY_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # N44 — supply chain, for a repository that holds eight credentials and runs unattended twice
      # a week. The SBOM is taken from the built JAR rather than from the dependency graph, so it
      # describes what shipped rather than what the build file asked for; the attestation is signed
      # against the same file, so "which dependencies were in the run that sent Thursday's edition"
      # has an answer that does not depend on anyone remembering.
      #
      # Both degrade honestly under the one remaining SNAPSHOT (Spring Boot 4.1.0-SNAPSHOT, see C2):
      # the SBOM records the version string, which resolves to different bytes over time. That is a
      # limitation of depending on a pre-release, not of the SBOM, and it disappears with the
      # SNAPSHOT.
      - name: Generate SBOM
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          file: build/libs/app.jar
          format: cyclonedx-json
          artifact-name: sbom-${{ github.run_id }}.cyclonedx.json
          output-file: build/libs/sbom.cyclonedx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3.0.0
        with:
          subject-path: build/libs/app.jar

      - name: Upload the attested JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-jar-${{ github.run_id }}
          path: |
            build/libs/app.jar
            build/libs/sbom.cyclonedx.json
          retention-days: 30

      - name: Run digest
        run: java -jar build/libs/app.jar 2>&1 | tee digest.log
        env:
          # N41 — the `ci` profile turns the console log into ECS JSON, so a failed run is
          # greppable by source and stage instead of by sentence. Local runs keep prose.
          SPRING_PROFILES_ACTIVE: ci
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_USERNAME: ${{ secrets.SUPABASE_DB_USERNAME }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PRODUCTHUNT_DEVELOPER_TOKEN: ${{ secrets.PRODUCTHUNT_DEVELOPER_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Every api.github.com source shares one rate limit: unauthenticated it is 60/h per IP, on a
          # runner whose IP other tenants share, which surfaced as the "GitHub API (token)" banner. The
          # automatic token needs no secret and lifts it to 1,000/h per repository.
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: external feedback receiver for the email 👍/👎 links (C6). Repository VARIABLE
          # (non-sensitive public URL), not a secret. Blank/unset = no links rendered.
          FEEDBACK_RECEIVER_URL: ${{ vars.FEEDBACK_RECEIVER_URL }}
          FEEDBACK_SIGNING_SECRET: ${{ secrets.FEEDBACK_SIGNING_SECRET }}

      # N34: the rendered edition, on every run and not only on failure. The app writes it before it
      # attempts delivery, so a run whose email bounced still leaves the digest downloadable here —
      # and "what did Thursday's edition look like?" is answerable from the Actions tab.
      - name: Upload rendered edition
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest-edition-${{ github.run_id }}
          path: build/digest.html
          retention-days: 30
          if-no-files-found: warn

      - name: Upload digest log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: digest-log-${{ github.run_id }}
          path: digest.log
          retention-days: 14
          if-no-files-found: ignore

      # Reliable backstop: emails the recipient when a scheduled run fails for ANY reason — including a
      # crash or an EMAIL_FAILED state where the app itself could not send its own failure alert. So a
      # broken digest is never silent.
      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$DIGEST_FROM_EMAIL" ] || [ -z "$DIGEST_TO_EMAIL" ]; then
            echo "Resend not configured — skipping failure email"
            exit 0
          fi
          payload=$(jq -nc \
            --arg from "$DIGEST_FROM_EMAIL" \
            --arg to "$DIGEST_TO_EMAIL" \
            --arg url "$RUN_URL" \
            '{from:$from, to:[$to],
              subject:"⚠️ PulseDigest: run NIE powiódł się",
              html:("<p>GitHub Actions run PulseDigest zakończył się błędem — digest mógł nie dotrzeć.</p><p><a href=\"" + $url + "\">Zobacz logi uruchomienia</a></p>")}')
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            || echo "Failure-notification email could not be sent"
