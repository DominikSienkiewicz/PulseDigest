version: 2
updates:
  # Keep the GitHub Actions used by the workflows pinned and up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Keep test/tooling libraries current. Spring Boot is intentionally on a pre-release
  # SNAPSHOT (bleeding-edge showcase), so it is excluded — bumping it is a deliberate manual act.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "org.springframework.boot*"
