version: 2

# One grouped pull request per ecosystem per week, not one per dependency.
#
# On 2026-11-16 nine separate Dependabot PRs were merged to main within 150 seconds. Each push starts
# three Gradle jobs (check, flyway, sonarcloud), so about 27 builds ran at once. The instancio-junit
# 6.2.1 bump was not in any restored setup-gradle cache, so every one of those builds requested it
# from Maven Central at the same moment from GitHub's shared runner addresses. Central answered
# 429 Too Many Requests. Gradle retries a 429 only three times within about three seconds, and three
# of the nine runs (#41, #45, #49) went red on a dependency Central was serving. Grouping turns a
# week of updates into at most two merges, so no merge burst can arise from Dependabot in the first
# place. If a group fails because of one bump, ignore that dependency here, and the rest of the
# group can still merge.
updates:
  # Keep the GitHub Actions used by the workflows pinned and up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep test/tooling libraries current. Spring Boot patch releases ride the weekly gradle group
  # below. Minor and major upgrades stay deliberate manual work: they move the documented stack
  # (README badge and diagram, AGENTS.md, social preview, EOL row) and need their release notes
  # read against this codebase.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "org.springframework.boot*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      gradle:
        patterns:
          - "*"
